[build]
  command = "npm run build && (if [ -d .output/public ] && [ ! -d dist ]; then cp -r .output/public dist; fi) && (if [ -d dist ] && [ -d .output/public ]; then cp -r .output/public/* dist/ 2>/dev/null || true; fi) && (if [ -d dist ] && [ ! -d .output/public ]; then mkdir -p .output/public && cp -r dist/* .output/public/; fi) && (if [ ! -d dist ]; then mkdir -p dist; fi) && echo '=== Build output directory contents: ===' && ls -la dist/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.18.0"
  NITRO_PRESET = "netlify"
  NODE_OPTIONS = "--max-old-space-size=4096"
  VITE_BACKEND_URL = "https://lawyer-backend-production-5c6d.up.railway.app"
  VITE_API_BASE_URL = "https://lawyer-backend-production-5c6d.up.railway.app"
  VITE_API_KEY = "amicus-dev-2024"
  VITE_CLERK_PUBLISHABLE_KEY = "pk_test_bGFyZ2Utcm9kZW50LTM4LmNsZXJrLmFjY291bnRzLmRldiQ"
  VITE_CLERK_SIGN_UP_URL = "/accept-invitation"
  VITE_SUPABASE_URL = "https://ogbuynedouxbvdhrheyq.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Fx60n2qkyChTyePGCSAxKg_52oa7e0h"
  VITE_SUPABASE_PROJECT_ID = "ogbuynedouxbvdhrheyq"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_bGFyZ2Utcm9kZW50LTM4LmNsZXJrLmFjY291bnRzLmRldiQ"
  VITE_CLERK_PUBLISHABLE_KEY_LIVE = "pk_live_Y2xlcmsuc2VjdGlvbi1haS5sb3ZhYmxlLmFwcCQ"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
